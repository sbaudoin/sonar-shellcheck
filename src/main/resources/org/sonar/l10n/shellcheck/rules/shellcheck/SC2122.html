<p><code>&gt;=</code> is not a valid operator. Use <code>! a &lt; b</code> instead.</p>
<h2>Problematic code</h2>
<pre><code class="language-sh">[[ a &amp;lt;= b ]]
</code></pre>
<h2>Correct code</h2>
<pre><code class="language-sh">[[ ! a &gt; b ]]
</code></pre>
<h2>Rationale</h2>
<p>The operators <code>&lt;=</code> and <code>&gt;=</code> are not supported by Bourne shells. Instead of &quot;less than or equal&quot;, rewrite as &quot;not greater than&quot;.</p>
<h2>Exceptions</h2>
<p>None</p>
